<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Fundación Ciudad Verde Ambiental</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style id="app-style">
/* Layout: banda de encabezado fija, hero en verde bosque con hojas, servicios en "fichas de vivero", noticias en retícula, contacto en bloque oscuro. */
:root{
  --bg:#F4F8F2; --surface:#FFFFFF; --soft:#E6F0E2; --fg:#14281F; --muted:#4F6A5C;
  --forest:#1E5B44; --forest-2:#163F31; --leaf:#6FAE3E; --leaf-soft:#D7EBC6; --sun:#E8B23A;
  --line:#CFE0C9; --on-forest:#F1F8EE; --shadow:0 10px 30px -14px rgba(20,60,40,.35);
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1A15; --surface:#14241D; --soft:#1A2F25; --fg:#E5F1E8; --muted:#9DB8A8;
  --forest:#1B4C39; --forest-2:#0B1F17; --leaf:#8CCB5A; --leaf-soft:#22402D; --sun:#F0C25A;
  --line:#284235; --on-forest:#EAF6EC; --shadow:0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1A15; --surface:#14241D; --soft:#1A2F25; --fg:#E5F1E8; --muted:#9DB8A8;
  --forest:#1B4C39; --forest-2:#0B1F17; --leaf:#8CCB5A; --leaf-soft:#22402D; --sun:#F0C25A;
  --line:#284235; --on-forest:#EAF6EC; --shadow:0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--forest-2)}
h1,h2,h3{font-family:var(--display);line-height:1.1;text-wrap:balance;margin:0}
p{margin:0}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
.wrap{max-width:1140px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Encabezado */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--forest-2);color:var(--on-forest)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand svg{width:44px;height:44px;flex:none}
.brand b{font-family:var(--display);font-size:1rem;line-height:1.05;display:block}
.brand small{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{text-decoration:none;padding:8px 12px;border-radius:999px;font-weight:600;font-size:.92rem}
.nav a:hover{background:rgba(255,255,255,.1)}
.login{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.35);background:transparent;color:var(--on-forest);padding:8px 14px;border-radius:999px;font-weight:700;font-size:.88rem;white-space:nowrap}
.login:hover{background:rgba(255,255,255,.1)}
.login.on{background:var(--sun);color:#2A1E00;border-color:var(--sun)}
.login svg{width:16px;height:16px}
@media (max-width:820px){.nav{display:none}.brand{margin-right:auto}}

/* Barra admin */
.adminbar{background:var(--sun);color:#2A1E00}
.adminbar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-block:8px;font-weight:700;font-size:.9rem}
.adminbar .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:11px 20px;font-weight:700;text-decoration:none;font-size:.95rem}
.btn-sun{background:var(--sun);color:#2A1E00}
.btn-ghost{background:transparent;border:1.5px solid currentColor}
.btn-dark{background:#2A1E00;color:#FFF6DC;padding:7px 14px;font-size:.85rem}
.btn-forest{background:var(--forest);color:var(--on-forest)}
.btn-danger{background:#B3261E;color:#fff}

/* Hero */
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 85% 10%, #2F7A57 0%, var(--forest) 45%, var(--forest-2) 100%);color:var(--on-forest)}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:1.25fr .9fr;gap:40px;padding-block:72px 96px;align-items:center}
.eyebrow{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--leaf-soft)}
.hero h1{font-size:clamp(2.3rem,5.4vw,4.1rem);font-weight:800;margin:14px 0 18px}
.hero h1 em{font-style:normal;color:#BFE58F}
.hero p.lead{font-size:1.12rem;max-width:34em;opacity:.92}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.leaves{position:absolute;inset:0;pointer-events:none;opacity:.5}
.ground{position:absolute;left:0;right:0;bottom:-1px;height:70px;z-index:1}
.tag-card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:22px;padding:24px;backdrop-filter:blur(4px)}
.tag-card h3{font-size:1.05rem;margin-bottom:6px}
.tag-card .loc{font-size:.85rem;opacity:.8;margin-bottom:16px}
.tag-card ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.tag-card li{display:flex;gap:10px;align-items:flex-start;font-weight:600}
.tag-card li svg{flex:none;width:22px;height:22px;margin-top:1px}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr;padding-block:48px 90px}}

/* Secciones */
section{padding-block:72px}
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;margin-bottom:32px}
.head h2{font-size:clamp(1.8rem,3.6vw,2.6rem);font-weight:800;color:var(--forest)}
:root[data-theme="dark"] .head h2{color:var(--leaf)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .head h2{color:var(--leaf)}}
.head p{color:var(--muted);max-width:36em}

.services{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.svc{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:12px;transition:transform .2s, box-shadow .2s}
.svc:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.svc .ic{width:52px;height:52px;border-radius:16px;background:var(--leaf-soft);display:grid;place-items:center;color:var(--forest)}
:root[data-theme="dark"] .svc .ic{color:var(--leaf)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .svc .ic{color:var(--leaf)}}
.svc .ic svg{width:28px;height:28px}
.svc h3{font-size:1.1rem}
.svc p{color:var(--muted);font-size:.94rem}

.about{background:var(--soft)}
.about .wrap{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.about h2{font-size:clamp(1.7rem,3.2vw,2.4rem);font-weight:800;margin-bottom:16px}
.about p{color:var(--muted);font-size:1.05rem;white-space:pre-line}
.pillars{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pillar{background:var(--surface);border-radius:18px;padding:18px;border:1px solid var(--line)}
.pillar b{font-family:var(--display);display:block;font-size:1.05rem;margin-bottom:4px}
.pillar span{color:var(--muted);font-size:.9rem}
@media (max-width:820px){.about .wrap{grid-template-columns:1fr}}

/* Noticias */
.news{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.card .ph{aspect-ratio:16/10;max-width:100%;background:var(--leaf-soft);display:block;width:100%;object-fit:cover}
.card .ph.gen{display:grid;place-items:center;color:var(--forest)}
.card .ph.gen svg{width:64px;height:64px;opacity:.7}
.card .body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.8rem;color:var(--muted)}
.chip{background:var(--leaf-soft);color:var(--forest);font-weight:700;padding:3px 10px;border-radius:999px;font-size:.75rem}
:root[data-theme="dark"] .chip{color:var(--leaf)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip{color:var(--leaf)}}
.chip.ex{background:var(--sun);color:#2A1E00}
.card h3{font-size:1.2rem}
.card p.ex{color:var(--muted);font-size:.95rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .more{margin-top:auto;padding-top:6px;background:none;border:0;color:var(--forest);font-weight:800;text-align:left;padding-left:0}
:root[data-theme="dark"] .card .more{color:var(--leaf)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .card .more{color:var(--leaf)}}
.card .tools{position:absolute;top:10px;right:10px;display:flex;gap:6px}
.card .tools button{border:0;border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:700;background:rgba(255,255,255,.95);color:#14281F;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.card .tools button.del{background:#B3261E;color:#fff}
.empty{border:2px dashed var(--line);border-radius:22px;padding:40px;text-align:center;color:var(--muted)}

/* Contacto */
.contact{background:var(--forest-2);color:var(--on-forest)}
.contact .wrap{display:grid;grid-template-columns:1fr 1.1fr;gap:40px}
.contact h2{font-size:clamp(1.8rem,3.6vw,2.6rem);font-weight:800;margin-bottom:12px}
.contact p{opacity:.85}
.clist{display:grid;gap:12px}
.citem{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:14px 16px;min-width:0}
.citem svg{width:24px;height:24px;flex:none;color:#BFE58F}
.citem div{min-width:0;flex:1}
.citem small{display:block;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.citem span{font-weight:700;overflow-wrap:anywhere;user-select:all}
.citem button{border:1px solid rgba(255,255,255,.3);background:transparent;color:inherit;border-radius:999px;padding:5px 12px;font-size:.8rem;font-weight:700;flex:none}
@media (max-width:820px){.contact .wrap{grid-template-columns:1fr}}
footer{background:var(--forest-2);color:var(--on-forest);border-top:1px solid rgba(255,255,255,.1)}
footer .wrap{padding-block:22px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;font-size:.85rem;opacity:.75}

/* Modal */
.modal{position:fixed;inset:0;z-index:100;background:rgba(8,20,14,.6);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--surface);color:var(--fg);border-radius:24px;width:min(680px,100%);max-height:100%;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.dialog .dh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.dialog .dh h3{font-size:1.2rem}
.x{border:0;background:var(--soft);color:var(--fg);width:36px;height:36px;border-radius:50%;font-size:1.2rem;line-height:1}
.dialog .db{padding:22px;display:grid;gap:14px}
.dialog .db img{border-radius:16px;width:100%}
.dialog .db .full{white-space:pre-line}
.field{display:grid;gap:6px}
.field label{font-weight:700;font-size:.9rem}
.field input,.field textarea,.field select{font:inherit;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
.field textarea{min-height:140px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.row2{grid-template-columns:1fr}}
.preview{border-radius:14px;max-height:220px;object-fit:cover;width:100%}
.hint{font-size:.85rem;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
.err{color:#B3261E;font-weight:700;font-size:.9rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:700;z-index:120;max-width:calc(100% - 32px)}
</style>

function drawLeaves(c){
  var r = c.getBoundingClientRect(); if (!r.width) return;
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  c.width = r.width * dpr; c.height = r.height * dpr;
  var g = c.getContext('2d'); g.scale(dpr, dpr);
  var seed = 7; function rnd(){ seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
  for (var i = 0; i < 26; i++){
    var x = rnd() * r.width, y = rnd() * r.height, s = 14 + rnd() * 46, a = rnd() * Math.PI * 2;
    g.save(); g.translate(x, y); g.rotate(a);
    g.fillStyle = 'rgba(191,229,143,' + (0.05 + rnd() * 0.12) + ')';
    g.beginPath(); g.moveTo(0, -s); g.quadraticCurveTo(s * .7, 0, 0, s); g.quadraticCurveTo(-s * .7, 0, 0, -s); g.fill();
    g.strokeStyle = 'rgba(241,248,238,.12)'; g.lineWidth = 1; g.beginPath(); g.moveTo(0, -s * .9); g.lineTo(0, s * .9); g.stroke();
    g.restore();
  }
}

/* ---------- Modales ---------- */
function modal(title, body){
  var m = h('div', {class:'modal', role:'dialog', 'aria-modal':'true'});
  function close(){ m.remove(); document.removeEventListener('keydown', esc); }
  function esc(e){ if (e.key === 'Escape') close(); }
  document.addEventListener('keydown', esc);
  m.addEventListener('click', function(e){ if (e.target === m) close(); });
  m.appendChild(h('div', {class:'dialog'},
    h('div', {class:'dh'}, h('h3', {text:title}), h('button', {class:'x', 'aria-label':'Cerrar', onclick:close, text:'×'})),
    h('div', {class:'db'}, body)));
  document.body.appendChild(m);
  var f = m.querySelector('input,textarea,button.btn'); if (f) f.focus();
  return close;
}

function newsForm(n){
  var editing = !!n;
  var img = editing ? safeImg(n.image) : '';
  var today = new Date(); var iso = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
  var fT = h('input', {id:'nf-title', maxlength:'140', value: editing ? n.title : ''});
  var fC = h('select', {id:'nf-cat'}, CATS.map(function(c){ return h('option', {value:c, selected: editing && n.category === c, text:c}); }));
  var fD = h('input', {id:'nf-date', type:'date', value: editing ? n.date : iso});
  var fX = h('textarea', {id:'nf-text'}); fX.value = editing ? n.text : '';
  var prev = h('img', {class:'preview', alt:'Vista previa', hidden: !img, src: img || null});
  var rm = h('button', {class:'btn btn-ghost', type:'button', hidden: !img, text:'Quitar foto'});
  var fI = h('input', {id:'nf-img', type:'file', accept:'image/*'});
  var err = h('p', {class:'err', hidden:true});
  fI.addEventListener('change', function(){
    var f = fI.files && fI.files[0]; if (!f) return;
    compress(f).then(function(d){ img = d; prev.src = d; prev.hidden = false; rm.hidden = false; },
      function(){ err.textContent = 'No se pudo leer esa imagen. Prueba con una foto JPG o PNG.'; err.hidden = false; });
  });
  rm.addEventListener('click', function(){ img = ''; prev.hidden = true; rm.hidden = true; fI.value = ''; });
  var saveBtn = h('button', {class:'btn btn-forest', type:'submit', text: editing ? 'Guardar cambios' : 'Publicar noticia'});
  var form = h('form', {style:'display:grid;gap:14px'},
    h('div', {class:'field'}, h('label', {for:'nf-title', text:'Título'}), fT),
    h('div', {class:'row2'},
      h('div', {class:'field'}, h('label', {for:'nf-cat', text:'Categoría'}), fC),
      h('div', {class:'field'}, h('label', {for:'nf-date', text:'Fecha'}), fD)),
    h('div', {class:'field'}, h('label', {for:'nf-text', text:'Texto de la noticia'}), fX),
    h('div', {class:'field'}, h('label', {for:'nf-img', text:'Foto (opcional)'}), fI,
      h('span', {class:'hint', text:'La foto se ajusta automáticamente para que la página cargue rápido.'})),
    prev, rm, err,
    h('div', {class:'actions'}, saveBtn));
  var close = modal(editing ? 'Editar noticia' : 'Nueva noticia', form);
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var title = fT.value.trim(), text = fX.value.trim();
    if (!title || !text){ err.textContent = 'Escribe al menos el título y el texto de la noticia.'; err.hidden = false; return; }
    var item = {id: editing ? n.id : 'n' + Date.now().toString(36), title:title, category:fC.value, date:fD.value || iso, text:text, image:img};
    if (editing) DATA.news = DATA.news.map(function(x){ return x.id === n.id ? item : x; });
    else DATA.news.push(item);
    saveBtn.disabled = true; saveBtn.textContent = 'Guardando…';
    save(editing ? 'Cambios guardados' : 'Noticia publicada', function(){ close(); });
  });
}

function compress(file){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file); var im = new Image();
    im.onload = function(){
      var max = 1280, w = im.naturalWidth, hh = im.naturalHeight, s = Math.min(1, max / Math.max(w, hh));
      w = Math.round(w * s); hh = Math.round(hh * s);
      var cv = document.createElement('canvas'); cv.width = w; cv.height = hh;
      cv.getContext('2d').drawImage(im, 0, 0, w, hh); URL.revokeObjectURL(url);
      res(cv.toDataURL('image/jpeg', 0.78));
    };
    im.onerror = function(){ URL.revokeObjectURL(url); rej(); };
    im.src = url;
  });
}

/* ---------- Guardar: la página se vuelve a publicar con los datos nuevos ---------- */
var RESET = ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}';
function buildDoc(){
  var css = document.getElementById('app-style').textContent;
  var js = document.getElementById('app-script').textContent;
  var json = JSON.stringify(DATA).replace(/</g, '\\u003c');
  var S = 'script';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + '</style></head><body>' +
    '<title>Fundación Ciudad Verde Ambiental</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n' +
    '<link rel="preconnect" href="https://fonts.googleapis.com">\n' +
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">\n' +
    '<style id="app-style">' + css + '</style>\n<div id="root"></div>\n' +
    '<' + S + ' type="application/json" id="site-data">' + json + '</' + S + '>\n' +
    '<' + S + ' id="app-script">' + js + '</' + S + '>\n</body></html>';
}
function save(okMsg, after){
  if (!STATE.artifact){ toast('Guardar no está disponible en esta vista.'); return; }
  try { sessionStorage.setItem('cva-admin', '1'); sessionStorage.setItem('cva-toast', okMsg); } catch(e){}
  STATE.artifact.publish(buildDoc()).then(function(){ if (after) after(); }, function(err){
    try { sessionStorage.removeItem('cva-toast'); } catch(e){}
    var code = err && err.code;
    if (code === 'conflict') toast('Alguien guardó otra versión; la página se está actualizando.');
    else if (code === 'not_writer' || code === 'not_granted' || code === 'consent_required'){ STATE.canEdit = false; STATE.admin = false; render(); toast('Esta cuenta no puede guardar cambios.'); }
    else if (code === 'too_large') toast('La página quedó muy pesada. Elimina algunas fotos antiguas e intenta de nuevo.');
    else toast('No se pudo guardar. Revisa tu conexión e intenta de nuevo.');
    if (after) after();
  });
}

/* ---------- Arranque ---------- */
render();
var reAdmin = false, pendingToast = '';
try { reAdmin = sessionStorage.getItem('cva-admin') === '1'; pendingToast = sessionStorage.getItem('cva-toast') || ''; sessionStorage.removeItem('cva-toast'); } catch(e){}
if (window.claude && window.claude.use){
  Promise.all([window.claude.use('user'), window.claude.use('artifact')]).then(function(r){
    var user = r[0]; STATE.artifact = r[1];
    return (user ? user.canEdit() : Promise.resolve(false)).then(function(ok){
      STATE.canEdit = !!ok && !!STATE.artifact; STATE.checked = true;
      if (STATE.canEdit && reAdmin){ STATE.admin = true; render(); }
      if (pendingToast && STATE.canEdit) toast(pendingToast);
    });
  }).catch(function(){ STATE.checked = true; });
} else { STATE.checked = true; }
window.addEventListener('resize', function(){ var c = document.querySelector('.leaves'); if (c) drawLeaves(c); });
})();
</script>
